spring.application.name=do-something
# Được maven-resources-plugin thay bằng version thật khi build.
app.version=@project.version@

# Actuator: /api/health đọc lại các health indicator này (db, redis, kafka, diskSpace).
# show-components trả về tên + trạng thái thành phần nhưng không lộ chi tiết nội bộ.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI. Tắt cả hai ở prod bằng biến môi trường
# SPRINGDOC_API_DOCS_ENABLED=false và SPRINGDOC_SWAGGER_UI_ENABLED=false.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
